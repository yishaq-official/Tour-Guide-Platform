services:
  # ==========================================
  # Database: MongoDB with Single-Node Replica Set (rs0)
  # ==========================================
  mongodb:
    image: mongo:7.0
    container_name: travelassist-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --quiet --eval "
          try {
            rs.status().ok;
          } catch (e) {
            rs.initiate({
              _id: 'rs0',
              members: [{ _id: 0, host: 'mongodb:27017' }]
            }).ok;
          }
        "
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - travelassist-network

  # ==========================================
  # Backend API: Node/Express TypeScript Server
  # ==========================================
  server:
    container_name: travelassist-server
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/travelAssist?replicaSet=rs0}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-travel-assist-secure-secret-key-at-least-32-chars-long}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:5000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - travelassist-network

  # ==========================================
  # Frontend: React Vite SPA served via Nginx
  # ==========================================
  client:
    container_name: travelassist-client
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
        VITE_AUTH_URL: ${VITE_AUTH_URL:-http://localhost:5000}
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - travelassist-network

volumes:
  mongo_data:
    driver: local

networks:
  travelassist-network:
    driver: bridge
